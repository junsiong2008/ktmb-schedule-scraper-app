name: nextstop_flutter
description: "NextStop - KTMB Train Schedule Mobile App"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.0
  intl: ^0.19.0
  google_fonts: ^6.2.0
  shared_preferences: ^2.3.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#0F172A"
  image: assets/splash_icon.png
  android: true
  ios: false

flutter:
  uses-material-design: true
