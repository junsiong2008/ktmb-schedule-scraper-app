name: Deploy Backend API to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'ktmb_api/**'
      - '.github/workflows/deploy_backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ktm-schedule-app
  SERVICE_NAME: ktmb-api
  REGION: us-central1
  IMAGE_NAME: gcr.io/ktm-schedule-app/ktmb_api
  # Database connectivity. Two modes:
  # 1. Cloud SQL connector (preferred, no VPC connector to pay for): set the
  #    repository variable CLOUDSQL_INSTANCE to the instance connection name
  #    (project:region:instance). DB_HOST then becomes the /cloudsql socket.
  # 2. VPC connector (legacy): used while CLOUDSQL_INSTANCE is unset. Egress is
  #    private-ranges-only so public calls (GTFS feed, holiday API) skip the
  #    connector and only private-IP traffic (the DB) goes through it.
  CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
  VPC_CONNECTOR: ktmb-ingestion-connector
  VPC_EGRESS: private-ranges-only

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Container
        working-directory: ktmb_api
        run: |
          BUILD_ID=$(gcloud builds submit --tag ${{ env.IMAGE_NAME }} \
            --suppress-logs \
            --format='value(id)')
    
          echo "Build ID: $BUILD_ID"
          echo "Logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ env.PROJECT_ID }}"
          
          STATUS=$(gcloud builds describe $BUILD_ID \
            --format='value(status)' \
            --project=${{ env.PROJECT_ID }})
          
          echo "Build status: $STATUS"
          
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "Build failed with status: $STATUS"
            exit 1
          fi

      - name: Deploy to Cloud Run
        run: |
          if [ -n "${{ env.CLOUDSQL_INSTANCE }}" ]; then
            echo "Connecting to Cloud SQL via the built-in connector (no VPC connector)"
            DB_HOST="/cloudsql/${{ env.CLOUDSQL_INSTANCE }}"
            NETWORK_FLAGS="--add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }} --clear-vpc-connector"
          else
            echo "Connecting to the database through VPC connector ${{ env.VPC_CONNECTOR }}"
            DB_HOST="${{ secrets.DB_HOST }}"
            NETWORK_FLAGS="--vpc-connector=${{ env.VPC_CONNECTOR }} --vpc-egress=${{ env.VPC_EGRESS }}"
          fi

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            $NETWORK_FLAGS \
            --set-env-vars="DB_HOST=${DB_HOST},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=${{ secrets.DB_NAME }},DB_PORT=5432" \
            --project=${{ env.PROJECT_ID }}
