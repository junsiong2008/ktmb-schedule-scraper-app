name: Deploy Next.js Frontend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'nextjs_frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ktm-schedule-app
  SERVICE_NAME: ktmb-nextjs-frontend
  REGION: us-central1
  IMAGE_NAME: gcr.io/ktm-schedule-app/ktmb_nextjs_frontend
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Container
        working-directory: nextjs_frontend
        run: |
          BUILD_ID=$(gcloud builds submit --config cloudbuild.yaml \
            --substitutions=_NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }},_IMAGE_NAME=${{ env.IMAGE_NAME }} \
            --suppress-logs \
            --format='value(id)')

          echo "Build ID: $BUILD_ID"
          echo "Logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ env.PROJECT_ID }}"
          
          STATUS=$(gcloud builds describe $BUILD_ID \
            --format='value(status)' \
            --project=${{ env.PROJECT_ID }})
          
          echo "Build status: $STATUS"
          
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "Build failed with status: $STATUS"
            exit 1
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 3000
